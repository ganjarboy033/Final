name: Build Android APK

on:
  push:
    branches: [main, master]
    paths-ignore: ['**.md', 'api/**', 'vercel.json']
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK parts (platform 36, build-tools, NDK)
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true
          sdkmanager "ndk;28.2.13676358" || true

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Sync Capacitor (public/ -> android)
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -n1)
          echo "APK: $APK"
          cp "$APK" dist/Mori-AIXI.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mori-AIXI-APK
          path: dist/Mori-AIXI.apk
          if-no-files-found: error

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Mori-AIXI.apk
